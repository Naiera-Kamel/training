var STW={};(function(){var i,a,b;for(i=0;i<PG.length;i++){for(a=0;a<PG[i].l.length;a++){for(b=0;b<PG[i].l[a].length;b++){STW[PG[i].l[a][b].split("|")[0]]=1;}}}})();
function inStory(x){
 var k;if(!x){return false;}
 x=x.replace(/\s*\+.*$/,"");
 if(x.indexOf("_")>-1){x=x.replace("_","");for(k in STW){if(STW.hasOwnProperty(k)&&k.indexOf(x)===0){return true;}}return false;}
 return !!STW[x];
}
function srcOf(q){
 if(q.src){return q.src;}
 if(q.v){return "o";}
 var c=[],k,p,pre;
 if(q.w){c.push(q.w);}
 if(q.s){for(k=0;k<q.s.length;k++){c.push(q.s[k]);}}
 if(q.ctx){p=q.ctx.split(" ");for(k=0;k<p.length;k++){c.push(p[k]);}}
 if(q.st){pre=q.st[0]+q.st[1];for(k in STW){if(STW.hasOwnProperty(k)&&k.indexOf(pre)===0){return "s";}}return "o";}
 if(!c.length&&q.o&&q.o[0].length>1){for(k=0;k<q.o.length;k++){c.push(q.o[k]);}}
 if(!c.length){return "";}
 for(k=0;k<c.length;k++){if(inStory(c[k])){return "s";}}
 return "o";
}

function prep(q){
 if(q.t&&q.t!=="mc"){return q;}
 var idx=[],k,n=q.o.length,c={};
 for(k=0;k<n;k++){idx.push(k);}shuffle(idx);
 for(k in q){if(q.hasOwnProperty(k)){c[k]=q[k];}}
 c.o=[];c.oc=q.oc?[]:null;
 for(k=0;k<n;k++){c.o.push(q.o[idx[k]]);if(q.oc){c.oc.push(q.oc[idx[k]]);}if(idx[k]===q.a){c.a=k;}}
 return c;
}

 S.qs=qs;S.qi=0;S.review=false;S.missed=[];S.score=0;S.fixed=0;S.res=[];S.total=qs.length;ask();
}

}
